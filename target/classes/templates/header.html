<head th:fragment="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
    <title>Chess</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            height: 100vh;
            margin: 0;
			background-color: #4A4A4A;
        }

        .popup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

		.info-popup-overlay {
		    display: none;
		    position: fixed;
		    top: 0;
		    left: 0;
		    width: 100%;
		    height: 100%;
		    background-color: rgba(0, 0, 0, 0.5);
		    z-index: 999;
		    justify-content: center;
		    align-items: center;
		    display: flex;
		}
		
		.info-popup-content {
		    background-color: white;
		    padding: 20px;
		    border-radius: 10px;
		    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
		    text-align: center;
		}
		
		#infoOkButton {
		    margin-top: 20px;
		    padding: 10px 20px;
		    background-color: #4CAF50;
		    color: white;
		    border: none;
		    border-radius: 5px;
		    cursor: pointer;
		}
		
		#infoOkButton:hover {
		    background-color: #45a049;
		}

        .chessboard {
            position: absolute;
            display: grid;
            top: [[${chessboardOffsetY}]]px;
            left: [[${chessboardOffsetX}]]px;
        }

        .chessboard div {
            position: absolute;
            width: [[${squareSize}]]px;
            height: [[${squareSize}]]px;
        }

        .chessboard div.white {
            background-color: white;
        }

        .chessboard div.black {
            background-color: #769656; /*[[${color}]];*/
        }

        .chessboard div.highlight-white {
            background-color: rgb(205, 171, 143);
        }

        .chessboard div.highlight-black {
            background-color: rgb(205, 171, 143);
        }

        .highlight-white {
            background-color: rgba(255, 255, 0, 0.6);
        }

        .highlight-black {
            background-color: rgba(255, 255, 0, 0.3);
        }

        .move-circle {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(160, 160, 180);
            z-index: 2;
            pointer-events: none; 
            transform: translate(-50%, -50%); 
        }

        .draggable {
            position: absolute;
            cursor: grab;
            z-index: 1;
            transition: top 1s, left 1s; 
        }

        .captured {
            pointer-events: none; 
            cursor: default; 
            opacity: 1; 
        }

        .settings {
            position: fixed;
            cursor: grab;
            top: 60px;
            left: 410px;
            width: 200px;
        }
       
		.move-list {
		    position: absolute;
		    width: [[${moveListWidth}]]px;
		    padding: 10px;
		    font-size: 13px;
		    background-color: #4A4A4A; /* Hintergrund in dunklem Grau */
		    color: #d3d3d3; /* Textfarbe in hellem Grau */
		    max-height: [[${chessboardSize}]]px;
		    overflow-y: auto;
		    box-shadow: none; /* Kein Schatten */
		    border: none; /* Kein Rand */
		    cursor: default; /* Nicht verschiebbar */
		    border-radius: 0; /* Keine abgerundeten Ecken */
		    z-index: 5;
		}

		.uciEngine-move-list {
		    position: absolute;
		    padding: 10px;
		    font-size: 14px;
		    background-color: ##4A4A4A; /* Hintergrund in dunklem Grau */
		    color: #d3d3d3; /* Textfarbe in hellem Grau */
		    max-height: [[${chessboardSize}]]px;
		    overflow-y: auto;
		    box-shadow: none; /* Kein Schatten */
		    border: none; /* Kein Rand */
		    cursor: default; /* Nicht verschiebbar */
		    border-radius: 0; /* Keine abgerundeten Ecken */
		    z-index: 5;
		}

        .uciEngine-move-list .uci-move-item {
            display: absolute;
            justify-content: flex-start;
            font-family: 'Courier New', Courier, monospace; 
            margin-bottom: 5px;
        } 

        .uciEngine-move-list .evaluation {
            font-weight: bold; 
            width: 50px; 
            text-align: right;
        }

        .uciEngine-move-list .colon {
            width: 10px;
            text-align: center; 
        }

        .uciEngine-move-list .move {
            margin-left: 5px; 
        }

        .uciEngine-move-list .uciEngine-header {
            font-weight: bold; 
            padding-bottom: 10px;
            margin-bottom: 10px; 
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
        }
		
		.uciEngine-move-list .uci-line-item.highlighted {
		    background-color: #3a3a3a; /* Dunkleres Grau für Kontrast */
		    color: #f0f0f0; /* Hellerer Text */
		}

        .chess-clocks {
            position: relative;
            display: flex;
            justify-content: space-between;
            top: [[${clocksTop}]]px;
            left: [[${clocksLeft}]]px;
            width: [[${clockWidth}]]px;
        }

        .whiteClock {
            padding: 5px;
            background-color: #f0f0f0;
            border: 2px solid #333;
            border-radius: 0;
            font-size: 24px;
            display: fey;
            width: 100%;
            text-align: center;
            box-shadow: 4px 8px 12px rgba(0, 0, 0, 0.7);
        }

        .blackClock {
            padding: 5px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 0;
            font-size: 24px;
            width: 100%;
            text-align: center;
            color: #ffffff; /* Korrekte Farbangabe für weißen Text */
            box-shadow: 4px 8px 12px rgba(0, 0, 0, 0.7);
        }

        .whiteEval {
            background-color: white;
            border: 2px solid #333;
            border-radius: 0;
            position: absolute;
            width: [[${evalWidth}]]px;
            height: [[${heightOfWhiteEval}]]px;
            top: [[${chessboardOffsetY}]]px;
            left: [[${evalLeft}]]px;
        }

        .blackEval {
            background-color: black;
            border: 2px solid #333;
            border-radius: 0;
            position: absolute;
            width: [[${evalWidth}]]px;
            height: [[${heightOfBlackEval}]]px;
            top: [[${chessboardOffsetY}]]px;
            left: [[${evalLeft}]]px;
            transition: height 1000ms ease-in-out; 
        }
        
        .draggable-evaluation-window {
		    position: absolute;
		    top: 100px; /* Standard-Startposition */
		    left: 100px; /* Standard-Startposition */
		    background-color: #fff;
		    border: 2px solid #333;
		    padding: 10px;
		    box-shadow: 4px 8px 12px rgba(0, 0, 0, 0.7);
		    z-index: 1000;
		    cursor: move;
		}
		
		.new-game-popup-overlay {
		    display: none; 
		    position: fixed;
		    top: 0;
		    left: 0;
		    width: 100%;
		    height: 100%;
		    background-color: rgba(0, 0, 0, 0.5);
		    z-index: 9999;
		    justify-content: center;
		    align-items: center;
		}
		
		.new-game-popup-content {
		    background-color: white;
		    padding: 20px;
		    border-radius: 10px;
		    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
		    text-align: center;
		    width: 600px; /* Breite des Popups */
		}
		
		.new-game-popup-header {
		    font-size: 20px;
		    font-weight: bold;
		    margin-bottom: 45px;
		}
		
		.new-game-popup-body {
		    display: flex;
		    flex-direction: column;
		    gap: 15px;
		}
		
		.new-game-popup-body .form-group {
		    display: flex;
		    justify-content: space-between;
		    align-items: center;
		}
		
		.new-game-popup-body label {
		    flex: 1;
		    text-align: left;
		    margin-right: 30px;
		}
		
		.new-game-popup-body input,
		.new-game-popup-body select {
		    flex: 1;
		    padding: 10px;
		    border-radius: 5px;
		    border: 1px solid #ccc;
		    box-sizing: border-box;
		    text-align: center;
		}
		
		.new-game-popup-footer {
		    margin-top: 20px;
		}
		
		.new-game-popup-footer button {
		    padding: 10px 20px;
		    background-color: #007BFF;
		    color: white;
		    border: none;
		    border-radius: 5px;
		    cursor: pointer;
		}
		
		.new-game-popup-footer button:hover {
		    background-color: #0056b3;
		}

		
		
		
		
		.game-analysis-popup-overlay {
				    display: none; 
				    position: fixed;
				    top: 0;
				    left: 0;
				    width: 100%;
				    height: 100%;
				    background-color: rgba(0, 0, 0, 0.5);
				    z-index: 9999;
				    justify-content: center;
				    align-items: center;
				}
				
				.game-analysis-popup-content {
				    background-color: white;
				    padding: 20px;
				    border-radius: 10px;
				    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
				    text-align: center;
				    width: 600px; /* Breite des Popups */
				}
				
				.game-analysis-popup-header {
				    font-size: 20px;
				    font-weight: bold;
				    margin-bottom: 45px;
				}
				
				.game-analysis-popup-body {
				    display: flex;
				    flex-direction: column;
				    gap: 15px;
				}
				
				.game-analysis-popup-body .form-group {
				    display: flex;
				    justify-content: space-between;
				    align-items: center;
				}
				
				.game-analysis-popup-body label {
				    flex: 1;
				    text-align: left;
				    margin-right: 30px;
				}
				
				.game-analysis-popup-body input,
				.game-analysis-popup-body select {
				    flex: 1;
				    padding: 10px;
				    border-radius: 5px;
				    border: 1px solid #ccc;
				    box-sizing: border-box;
				    text-align: center;
				}
				
				.game-analysis-popup-footer {
				    margin-top: 20px;
				}
				
				.game-analysis-popup-footer button {
				    padding: 10px 20px;
				    background-color: #007BFF;
				    color: white;
				    border: none;
				    border-radius: 5px;
				    cursor: pointer;
				}
				
				.game-analysis-popup-footer button:hover {
				    background-color: #0056b3;
				}
		
		
		
		
		
		
		.hovering_chessboard {
		    display: none; 
		    position: absolute;
		    width: 300px;
		    height: 300px;
		    background-color: #f5f5f5;
		    border: 2px solid #333;
		    z-index: 1100;
		    box-shadow: 4px 8px 12px rgba(0, 0, 0, 0.7);
		    grid-template-columns: repeat(8, 1fr);
		    grid-template-rows: repeat(8, 1fr);
		}
		
		.hovering_chessboard .square {
		    width: 100%;
		    height: 100%;
		}
		
		.hovering_chessboard .square.white {
		    background-color: #ffffff;
		}
		
		.hovering_chessboard .square.black {
		    background-color: #b38b6d;
		}
		
		.hovering_chessboard .piece {
		    width: 100%;
		    height: 100%;
		    background-size: cover;
		    background-position: center;
		}
		
		.menu-title {
		    font-size: 16px;
		    padding: 10px;
		    background-color: #444;
		    margin-bottom: 5px;
		    cursor: pointer;
		    color: white;
		    border-radius: 5px;
		}

		.submenu {
		    list-style-type: none;
		    padding-left: 15px;
		    display: none; /* Versteckt das Untermenü standardmäßig */
		}

		.submenu li {
		    margin: 5px 0;
		}

		.submenu li button,
		.submenu li a {
		    width: 100%;
		    padding: 6px;
		    font-size: 14px;
		    background-color: #333;
		    color: white;
		    border: none;
		    border-radius: 3px;
		    text-align: left;
		    cursor: pointer;
		    text-decoration: none;
		}

		.submenu li button:hover,
		.submenu li a:hover {
		    background-color: #666;
		}
		
		.sidebar {
			position: fixed;
		    width: 250px;
		    background-color: #333;
		    color: white;
		    padding: 20px;
		    box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
		    height: 100vh; /* Füllt die gesamte Höhe des Bildschirms */
		    position: fixed;
		    top: 0;
		    left: 0;
			z-index: 2000;
		    overflow-y: auto;
		    border-radius: 0; /* Keine abgerundeten Ecken */
			transform: translateX(-100%);
			transition: transform 0.3s ease;
		}
		
		
		.sidebar-mainicon{
			width: 150px; /* Einheitliche Breite */
			height: auto; /* Höhe automatisch skalieren */
			margin-right: 8px;
			vertical-align: middle;
		}
		
		.sidebar.visible {
		    transform: translateX(0);
		}
		
		#closeSidebar {
		    background-color: #444;
		    color: white;
		    border: none;
		    padding: 10px;
		    cursor: pointer;
		    font-size: 16px;
		    margin-bottom: 20px;
		    border-radius: 5px;
		}
		
		.sidebar-chessboard {
		    display: flex; /* Flexbox für einfaches Zentrieren */
		    justify-content: center; /* Zentriert Inhalte horizontal */
		    align-items: center; /* Zentriert Inhalte vertikal */
		    width: 100%; /* Füllt die Breite des Containers */
		    margin: 20px 0; /* Abstände oben und unten */
		    padding: 0; /* Entferne eventuelle Innenabstände */
		}

		.sidebar-chessboard .square {
		    width: 100%;
		    padding-top: 100%; /* Quadratische Felder */
		}

		.sidebar-chessboard .square.white {
		    background-color: #f0f0f0;
		}

		.sidebar-chessboard .square.brown {
		    background-color: #d2b48c; /* Helles Braun */
		}
		.sidebar-icon {
		    width: 24px; /* Einheitliche Breite */
		    height: auto; /* Höhe automatisch skalieren */
		    margin-right: 8px;
		    vertical-align: middle;
		}		

    </style>
	<style th:if="${showChart}">
	    #evaluationChart {
	        position: absolute;
	        z-index: 1;
			background-color: transparent;
	        top: 700px;
	        left: 900px;
			width: 400px;
	    }
	</style>
</head>
